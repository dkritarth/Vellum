name: macOS build

# Builds Vellum.app for Apple Silicon on a real macOS runner so the
# better-sqlite3 binding is compiled for the matching platform and arch.
# Runs on PRs that touch packaging, manually from the Actions tab, or push a `v*` tag to attach the DMGs to
# a GitHub release.
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - electron-builder.yml
      - scripts/after-pack-adhoc-sign.cjs
      - package.json
      - package-lock.json
      - resources/**
      - .github/workflows/release-mac.yml
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    name: mac-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build and package
        env:
          # No Developer ID certificate; afterPack ad-hoc signs instead.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac -- --${{ matrix.arch }}
      - name: Check packaged SQLite binding architecture
        run: |
          app=$(find release -maxdepth 2 -name Vellum.app | head -1)
          file "$app/Contents/Resources/native/better_sqlite3.node"
          file "$app/Contents/Resources/native/better_sqlite3.node" | grep -q "${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}"
          codesign --verify --deep --strict --verbose=2 "$app"
      - uses: actions/upload-artifact@v4
        with:
          name: Vellum-mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    name: attach-to-release
    needs: mac
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Vellum $GITHUB_REF_NAME" \
                 --notes "macOS builds. Ad-hoc signed: on first launch right-click Vellum.app and choose Open."
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
