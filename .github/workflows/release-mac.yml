name: macOS build

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - electron-builder.yml
      - scripts/after-pack-adhoc-sign.cjs
      - scripts/release-metadata.mjs
      - scripts/check-package-contents.mjs
      - test/packaged-mac-smoke.mjs
      - test/harness.mjs
      - package.json
      - package-lock.json
      - resources/**
      - .github/workflows/release-mac.yml
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  mac:
    name: mac-arm64
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate release identity
        id: release
        run: node scripts/release-metadata.mjs
      - run: npm ci
      - name: Build and package Apple Silicon app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:mac -- --arm64
      - name: Verify native binding and signature
        run: |
          app=$(find release -maxdepth 2 -name Vellum.app | head -1)
          test -n "$app"
          file "$app/Contents/Resources/native/better_sqlite3.node" | grep -q arm64
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Check package contents
        run: |
          app=$(find release -maxdepth 2 -name Vellum.app | head -1)
          node scripts/check-package-contents.mjs "$app"
      - name: Exercise the packaged app
        run: |
          app=$(find release -maxdepth 2 -name Vellum.app | head -1)
          node test/packaged-mac-smoke.mjs "$app/Contents/MacOS/Vellum"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vellum-mac-smoke-evidence
          path: test-artifacts/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Vellum-mac-arm64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    name: attach-to-release
    needs: mac
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate release identity
        id: metadata
        run: node scripts/release-metadata.mjs
      - uses: actions/download-artifact@v4
        with:
          name: Vellum-mac-arm64
          path: release-assets
      - name: Publish complete beta downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          PRERELEASE: ${{ steps.metadata.outputs.prerelease }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          test -f "docs/releases/$RELEASE_TAG.md"
          test -f "release-assets/Vellum-$VERSION-arm64.dmg"
          test -f "release-assets/Vellum-$VERSION-arm64.zip"
          (cd release-assets && sha256sum *.dmg *.zip > SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]; then
              echo "Release already published; leaving its assets unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --draft --prerelease="$PRERELEASE" --latest=false --title "Vellum $RELEASE_TAG" \
              --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false \
            --prerelease="$PRERELEASE" --latest=false
